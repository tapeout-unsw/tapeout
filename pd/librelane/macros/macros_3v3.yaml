    vh:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/verilog/gf180mcu_ocd_ip_sram__sram512x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_3v30":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram512x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram512x8m8wm1__ff_n40C_3v60.lib
      "*_ss_125C_3v00":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram512x8m8wm1__ss_125C_3v00.lib
    instances:
      # Snowy dual core: four 512x8 lanes, 2x2 at the top of the core, all pins-down
      # (signal pins are on the macro's bottom edge). 100 um channel between
      # the rows for the upper pair's pins. Names exactly as in the
      # synthesised netlist, without backslashes.
      'i_chip_core.u_soc_top.u_sram.g_lane[0].u_lane.g_512.u_sram':
        location: [617, 1286]
        orientation: N
      'i_chip_core.u_soc_top.u_sram.g_lane[1].u_lane.g_512.u_sram':
        location: [1018, 1286]
        orientation: N
      'i_chip_core.u_soc_top.u_sram.g_lane[2].u_lane.g_512.u_sram':
        location: [617, 1708]
        orientation: N
      'i_chip_core.u_soc_top.u_sram.g_lane[3].u_lane.g_512.u_sram':
        location: [1018, 1708]
        orientation: N

# Regex on instance names: one entry covers all four lanes.
PDN_MACRO_CONNECTIONS:
- 'i_chip_core\.u_soc_top\.u_sram\..*u_sram VDD VSS VDD VSS'
