[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapeout-host"
version = "0.1.0"
description = "Standalone KV260 host application for the dual-core RV32E SoC"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tapeout-host = "tapeout_host.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tapeout_host = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "runtime/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
